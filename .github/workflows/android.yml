name: Android CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest > gradle-test.log 2>&1
          status=$?
          cat gradle-test.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 60 gradle-test.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Gradle test failure::$message"
          fi
          exit "$status"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: MicRouter-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
